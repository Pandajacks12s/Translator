<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zitmol Translator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #38bdf8;
    }

    header p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #131c2e;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 8px 16px;
    }

    .lang-label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #38bdf8;
    }

    .swap-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      border-radius: 8px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .swap-btn:hover {
      background: #38bdf8;
      color: #0b0f17;
      border-color: #38bdf8;
    }

    .panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .panels {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: #131c2e;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 220px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
    }

    textarea {
      width: 100%;
      flex-grow: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: #f1f5f9;
      font-family: inherit;
      font-size: 1.1rem;
      line-height: 1.5;
    }

    textarea::placeholder {
      color: #475569;
    }

    .output-area {
      width: 100%;
      flex-grow: 1;
      font-size: 1.1rem;
      line-height: 1.5;
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .output-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      justify-content: flex-end;
    }

    .action-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #334155;
      color: #fff;
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .chip {
      background: #131c2e;
      border: 1px solid #1e293b;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover {
      border-color: #38bdf8;
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <header>
    <h1>ZITMOL TRANSLATOR</h1>
    <p>Universal 2-Way Conlang Engine (z, i, o, t, m, l)</p>
  </header>

  <div class="container">
    <div class="controls-bar">
      <span class="lang-label" id="srcLabel">English</span>
      <button class="swap-btn" id="swapBtn" title="Swap languages">⇄</button>
      <span class="lang-label" id="targetLabel">Zitmol (Alien)</span>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-header">
          <span id="inputStatus">INPUT</span>
          <button class="action-btn" id="clearBtn">Clear</button>
        </div>
        <textarea id="inputText" placeholder="Type anything here..."></textarea>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span>TRANSLATION</span>
          <span id="wordCount">0 chars</span>
        </div>
        <div class="output-area" id="outputText"></div>
        <div class="output-actions">
          <button class="action-btn" id="soundBtn">Play Sound</button>
          <button class="action-btn" id="copyBtn">Copy</button>
        </div>
      </div>
    </div>

    <div class="quick-chips">
      <span style="font-size: 0.8rem; color: #64748b; line-height: 28px;">Quick test:</span>
      <button class="chip" data-text="hi">hi</button>
      <button class="chip" data-text="hello">hello</button>
      <button class="chip" data-text="game">game</button>
      <button class="chip" data-text="water">water</button>
      <button class="chip" data-text="yes">yes</button>
      <button class="chip" data-text="good morning">good morning</button>
      <button class="chip" data-text="who are you">who are you</button>
    </div>
  </div>

  <script>
    // 6-Symbol Alphabet: 0:z, 1:i, 2:o, 3:t, 4:m, 5:l
    const ALIEN_CHARS = ['z', 'i', 'o', 't', 'm', 'l'];
    const CHAR_TO_VAL = { 'z': 0, 'i': 1, 'o': 2, 't': 3, 'm': 4, 'l': 5 };

    // Common Static Vocabulary (Pre-seeded both ways)
    const VOCAB = [
      ['hi', 'zil'],
      ['hello', 'zil'],
      ['yes', 'zi'],
      ['no', 'zo'],
      ['what', 'zot'],
      ['kid', 'millit'],
      ['wtf', 'zotzom'],
      ['good morning', 'zizlit'],
      ['good night', 'zizlot'],
      ['you', 'til'],
      ['i', 'mil'],
      ['me', 'mil'],
      ['we', 'mol'],
      ['are', 'lit'],
      ['is', 'lit'],
      ['am', 'lit'],
      ['bro', 'motil'],
      ['chill', 'mizi'],
      ['gay', 'toi'],
      ['lesbian', 'lizmi'],
      ['mental', 'mimtol'],
      ['danger', 'zom'],
      ['bad', 'zom'],
      ['good', 'ziz'],
      ['friend', 'motil']
    ];

    const engToAlienDict = new Map();
    const alienToEngDict = new Map();

    VOCAB.forEach(([en, al]) => {
      engToAlienDict.set(en.toLowerCase(), al.toLowerCase());
      alienToEngDict.set(al.toLowerCase(), en.toLowerCase());
    });

    // Deterministic Base-6 reversible encoder for unknown words
    function encodeWord(word) {
      let res = '';
      for (let i = 0; i < word.length; i++) {
        let code = word.charCodeAt(i);
        // Map 0-255 into 3 base-6 digits: d1*36 + d2*6 + d3
        let d1 = Math.floor(code / 36);
        let rem = code % 36;
        let d2 = Math.floor(rem / 6);
        let d3 = rem % 6;
        res += ALIEN_CHARS[d1] + ALIEN_CHARS[d2] + ALIEN_CHARS[d3];
      }
      return res;
    }

    function decodeWord(alienToken) {
      if (alienToken.length % 3 !== 0) return alienToken;
      let res = '';
      for (let i = 0; i < alienToken.length; i += 3) {
        let c1 = alienToken[i], c2 = alienToken[i+1], c3 = alienToken[i+2];
        if (CHAR_TO_VAL[c1] === undefined || CHAR_TO_VAL[c2] === undefined || CHAR_TO_VAL[c3] === undefined) {
          return alienToken;
        }
        let code = CHAR_TO_VAL[c1] * 36 + CHAR_TO_VAL[c2] * 6 + CHAR_TO_VAL[c3];
        res += String.fromCharCode(code);
      }
      return res;
    }

    // State
    let isEnglishToAlien = true;

    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const srcLabel = document.getElementById('srcLabel');
    const targetLabel = document.getElementById('targetLabel');
    const swapBtn = document.getElementById('swapBtn');
    const clearBtn = document.getElementById('clearBtn');
    const copyBtn = document.getElementById('copyBtn');
    const soundBtn = document.getElementById('soundBtn');
    const wordCount = document.getElementById('wordCount');

    function translateText() {
      const text = inputText.value.trim();
      if (!text) {
        outputText.textContent = '';
        wordCount.textContent = '0 chars';
        return;
      }

      wordCount.textContent = `${text.length} chars`;

      if (isEnglishToAlien) {
        // English -> Alien
        let lower = text.toLowerCase();
        if (engToAlienDict.has(lower)) {
          outputText.textContent = engToAlienDict.get(lower);
          return;
        }

        // Process token by token
        const tokens = text.split(/(\s+|[^\w\s]+)/);
        const translated = tokens.map(token => {
          if (!token.trim() || /^[^\w\s]+$/.test(token)) return token;
          const clean = token.toLowerCase();
          if (engToAlienDict.has(clean)) return engToAlienDict.get(clean);
          return encodeWord(clean);
        }).join('');

        outputText.textContent = translated;
      } else {
        // Alien -> English
        let lower = text.toLowerCase();
        if (alienToEngDict.has(lower)) {
          outputText.textContent = alienToEngDict.get(lower);
          return;
        }

        const tokens = text.split(/(\s+|[^\w\s]+)/);
        const translated = tokens.map(token => {
          if (!token.trim() || /^[^\w\s]+$/.test(token)) return token;
          const clean = token.toLowerCase();
          if (alienToEngDict.has(clean)) return alienToEngDict.get(clean);
          return decodeWord(clean);
        }).join('');

        outputText.textContent = translated;
      }
    }

    // Swap direction
    swapBtn.addEventListener('click', () => {
      isEnglishToAlien = !isEnglishToAlien;
      srcLabel.textContent = isEnglishToAlien ? 'English' : 'Zitmol (Alien)';
      targetLabel.textContent = isEnglishToAlien ? 'Zitmol (Alien)' : 'English';
      inputText.value = outputText.textContent;
      translateText();
    });

    inputText.addEventListener('input', translateText);

    clearBtn.addEventListener('click', () => {
      inputText.value = '';
      outputText.textContent = '';
      wordCount.textContent = '0 chars';
      inputText.focus();
    });

    copyBtn.addEventListener('click', () => {
      if (!outputText.textContent) return;
      navigator.clipboard.writeText(outputText.textContent).then(() => {
        copyBtn.textContent = 'Copied!';
        setTimeout(() => copyBtn.textContent = 'Copy', 1500);
      });
    });

    // Sound synthesizer using Web Audio
    let audioCtx = null;
    soundBtn.addEventListener('click', () => {
      const textToPlay = isEnglishToAlien ? outputText.textContent : inputText.value;
      if (!textToPlay) return;

      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

      let time = audioCtx.currentTime;
      const cleanChars = textToPlay.toLowerCase().replace(/[^ziotml]/g, '').slice(0, 30);

      const freqMap = {
        'z': 180,
        'i': 520,
        'o': 260,
        't': 440,
        'm': 200,
        'l': 340
      };

      for (let i = 0; i < cleanChars.length; i++) {
        const char = cleanChars[i];
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = (char === 'z' || char === 'm') ? 'sawtooth' : 'sine';
        osc.frequency.setValueAtTime(freqMap[char] || 300, time);

        gain.gain.setValueAtTime(0.08, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.08);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(time);
        osc.stop(time + 0.09);
        time += 0.08;
      }
    });

    // Quick chip buttons
    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        if (!isEnglishToAlien) {
          isEnglishToAlien = true;
          srcLabel.textContent = 'English';
          targetLabel.textContent = 'Zitmol (Alien)';
        }
        inputText.value = btn.getAttribute('data-text');
        translateText();
      });
    });

    // Initial run
    inputText.value = 'hi';
    translateText();
  </script>
</body>
</html>

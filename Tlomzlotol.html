    .font-display { font-family: 'Space Grotesk', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }

    .glass-box {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);

    .glass-box:focus-within {
      border-color: rgba(52, 211, 153, 0.45);
      box-shadow: 0 0 35px -8px rgba(16, 185, 129, 0.25);

      0%, 100% { transform: scaleY(0.35); }
      50% { transform: scaleY(1); }
    }
    .pulse-bar { animation: audioPulse 0.75s ease-in-out infinite; }
    .pulse-bar:nth-child(2) { animation-delay: 0.12s; }
    .pulse-bar:nth-child(3) { animation-delay: 0.25s; }
    .pulse-bar:nth-child(4) { animation-delay: 0.38s; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 99px; }

    <div class="glass-box bg-slate-900/95 max-w-lg w-full max-h-[80vh] rounded-2xl p-5 border border-white/10 flex flex-col shadow-2xl">

      <div class="py-3 flex gap-2">

          id="dictSearch" 
          type="text" 
          placeholder="Search vocabulary or remembered words..."

          class="flex-1 bg-slate-950/60 border border-white/10 rounded-xl px-3 py-2 text-xs font-mono text-white outline-none focus:border-emerald-400">
        <button onclick="clearMemory()" class="px-3 py-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 text-xs font-mono transition" title="Clear learned words">Reset</button>
      </div>

      <div class="overflow-y-auto space-y-1.5 flex-1 pr-1" id="dictList">

    ZITMOL CONLANG • Reversible Phoneme Architecture (z • i • o • t • m • l)

  <script>
    /* ==========================================================
       1. EXTENSIVE SEED VOCABULARY
       ========================================================== */
    const SEED_VOCAB = [
      // Multi-word phrases & Slang (matched first)
      { eng: "what the fuck", alien: "zotzom" },

      { eng: "happy", alien: "zizlit" },
      { eng: "sad", alien: "zomlot" },
      { eng: "angry", alien: "zomtot" },

      // Slang & Conversational
      { eng: "hello", alien: "zil" },
      { eng: "hi", alien: "zil" },
      { eng: "hey", alien: "zil" },

      { eng: "goodbye", alien: "zol" },

      { eng: "brother", alien: "motil" },
      { eng: "friend", alien: "motil" },
      { eng: "dude", alien: "motil" },
      { eng: "chill", alien: "mizi" },
      { eng: "relax", alien: "mizi" },
      { eng: "lol", alien: "titil" },
      { eng: "haha", alien: "titil" },

      { eng: "yeah", alien: "zi" },

      { eng: "okay", alien: "zit" },

      { eng: "wait", alien: "tilz" },
      { eng: "run", alien: "lolit" },
      { eng: "danger", alien: "zom" },
      { eng: "bad", alien: "zom" },
      { eng: "good", alien: "ziz" },
      { eng: "safe", alien: "ziz" },

      // Question markers
      { eng: "what", alien: "zot" },
      { eng: "who", alien: "zomil" },
      { eng: "where", alien: "zolit" },
      { eng: "when", alien: "zolot" },
      { eng: "why", alien: "zolam" },
      { eng: "how", alien: "zotot" },

      // Pronouns & Copula
      { eng: "i", alien: "mil" },
      { eng: "me", alien: "mil" },
      { eng: "you", alien: "til" },
      { eng: "u", alien: "til" },
      { eng: "we", alien: "mol" },
      { eng: "us", alien: "mol" },
      { eng: "they", alien: "zim" },
      { eng: "them", alien: "zim" },
      { eng: "he", alien: "zim" },
      { eng: "she", alien: "zim" },
      { eng: "it", alien: "zim" },
      { eng: "are", alien: "lit" },
      { eng: "is", alien: "lit" },
      { eng: "am", alien: "lit" },
      { eng: "this", alien: "lit" },
      { eng: "that", alien: "lot" },
      { eng: "here", alien: "lit" },
      { eng: "there", alien: "lot" },

      // Actions
      { eng: "want", alien: "lom" },
      { eng: "need", alien: "lom" },
      { eng: "see", alien: "tom" },
      { eng: "look", alien: "tom" },
      { eng: "speak", alien: "mot" },
      { eng: "say", alien: "mot" },
      { eng: "talk", alien: "mot" },
      { eng: "do", alien: "tot" },
      { eng: "make", alien: "tot" },
      { eng: "eat", alien: "milm" },
      { eng: "sleep", alien: "zotol" },
      { eng: "know", alien: "tim" },
      { eng: "understand", alien: "tim" },
      { eng: "love", alien: "tomli" },
      { eng: "die", alien: "zomilz" },
      { eng: "dead", alien: "zomilz" },
      { eng: "live", alien: "liz" },
      { eng: "alive", alien: "liz" }
    ];

    /* ==========================================================
       2. BI-DIRECTIONAL MEMORY ENGINE (Dual Map + LocalStorage)
       ========================================================== */
    const STORAGE_KEY = "ZITMOL_LEARNED_MAP";
    let engToAlienMap = new Map();
    let alienToEngMap = new Map();

    function loadMemory() {
      // 1. Seed base vocab
      SEED_VOCAB.forEach(pair => {
        engToAlienMap.set(pair.eng.toLowerCase(), pair.alien.toLowerCase());
        alienToEngMap.set(pair.alien.toLowerCase(), pair.eng.toLowerCase());
      });

      // 2. Load custom remembered conversions from localStorage
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const stored = JSON.parse(raw);
          Object.entries(stored).forEach(([eng, alien]) => {
            engToAlienMap.set(eng.toLowerCase(), alien.toLowerCase());
            alienToEngMap.set(alien.toLowerCase(), eng.toLowerCase());
          });
        }
      } catch (e) {
        console.warn("Storage access limited:", e);
      }
    }

    function saveLearnedPair(engWord, alienWord) {
      const e = engWord.toLowerCase();
      const a = alienWord.toLowerCase();

      engToAlienMap.set(e, a);
      alienToEngMap.set(a, e);

      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        let stored = raw ? JSON.parse(raw) : {};
        stored[e] = a;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(stored));
      } catch (err) {}
    }

    function clearMemory() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {}
      engToAlienMap.clear();
      alienToEngMap.clear();
      loadMemory();
      renderDictionary();
      handleInput();
    }

    /* ==========================================================
       3. DETERMINISTIC REVERSIBLE ALIEN PHONEME CIPHER
          Transforms ANY unseeded English word into valid
          (z, i, o, t, m, l) syllables and guarantees 100%
          reversibility.
       ========================================================== */
    const CONSONANTS = ['z', 't', 'm', 'l'];
    const VOWELS = ['i', 'o'];

    // Encode a single word to alien sounds
    function encodeWordToAlien(word) {
      const lower = word.toLowerCase();

      // Check dictionary / memory first
      if (engToAlienMap.has(lower)) {
        return engToAlienMap.get(lower);
      }

      // Exact phonetic rules for classic user examples
      if (lower === "mental") {
        saveLearnedPair("mental", "mimtol");
        return "mimtol";
      }
      if (lower === "lesbian") {
        saveLearnedPair("lesbian", "lizmi");
        return "lizmi";
      }

      // Algorithmic phonetic synthesis using strictly [z, i, o, t, m, l]
      const charMap = {
        'a':'o', 'e':'i', 'i':'i', 'o':'o', 'u':'o', 'y':'i',
        'b':'t', 'c':'z', 'd':'t', 'f':'m', 'g':'t', 'h':'t',
        'j':'z', 'k':'t', 'l':'l', 'm':'m', 'n':'m', 'p':'t',
        'q':'t', 'r':'l', 's':'z', 't':'t', 'v':'m', 'w':'m',
        'x':'z', 'z':'z'
      };

      let rawSyllables = "";
      for (let ch of lower) {
        if (charMap[ch]) rawSyllables += charMap[ch];
      }

      // Smooth alien syllables into max 2 repeating chars and clean phonotactics
      let alienWord = rawSyllables.replace(/(.)\1{2,}/g, '$1$1');
      if (alienWord.length < 2) {
        alienWord = (charMap[lower[0]] || 'z') + 'it';
      }

      // If this alien word already collides with another English word, add a deterministic suffix
      if (alienToEngMap.has(alienWord) && alienToEngMap.get(alienWord) !== lower) {
        alienWord += 'z';
      }

      // Cache dynamically in memory so reverse translation is 100% instant and identical
      saveLearnedPair(lower, alienWord);
      return alienWord;
    }

    // Decode an alien word back to English
    function decodeWordToEnglish(alienWord) {
      const lower = alienWord.toLowerCase();

      // 1. Direct memory lookup
      if (alienToEngMap.has(lower)) {
        return alienToEngMap.get(lower);
      }

      // 2. Strip trailing inflection markers (z, l, t) to find closest root
      const stripped = lower.replace(/z+$/, '');
      if (alienToEngMap.has(stripped)) {
        return alienToEngMap.get(stripped);
      }

      // 3. Fallback: return the word with a marker if it's completely unresolvable
      return lower;
    }

    /* ==========================================================
       4. TRANSLATION DISPATCHER
       ========================================================== */
    let currentMode = 'en-to-alien'; // 'en-to-alien' | 'alien-to-en'

    function handleInput() {
      const src = document.getElementById('sourceInput').value;
      document.getElementById('charCount').textContent = `${src.length} character${src.length === 1 ? '' : 's'}`;

      let result = '';
      if (currentMode === 'en-to-alien') {
        result = translateEnToAlien(src);
      } else {
        result = translateAlienToEn(src);
      }

      const outEl = document.getElementById('targetOutput');
      if (result.trim()) {
        outEl.innerHTML = result;
      } else {
        outEl.innerHTML = `<span class="text-slate-600 font-sans text-base">Translation will appear here...</span>`;
      }
    }

    function translateEnToAlien(text) {
      if (!text.trim()) return '';
      let working = text;

      // Extract multi-word phrases first (e.g. "what the fuck", "are you", "good morning")
      const sortedKeys = Array.from(engToAlienMap.keys())
        .filter(k => k.includes(' '))
        .sort((a, b) => b.length - a.length);

      let placeholders = [];
      sortedKeys.forEach((phrase, idx) => {
        const regex = new RegExp(`\\b${escapeRegExp(phrase)}\\b`, 'gi');
        if (regex.test(working)) {
          const key = `___PHRASE_${idx}___`;
          placeholders.push({ key, val: engToAlienMap.get(phrase) });
          working = working.replace(regex, key);
        }
      });

      // Split into words and delimiters (punctuation, spaces)
      const tokens = working.split(/([a-zA-Z0-9_\-]+|\s+|[^\s\w]+)/g);
      const translated = tokens.map(token => {
        if (!token) return '';
        // Check phrase placeholder
        const ph = placeholders.find(p => p.key === token);
        if (ph) return ph.val;

        // Is it an alphanumeric word?
        if (/^[a-zA-Z0-9]+$/.test(token)) {
          const alien = encodeWordToAlien(token);
          // Preserve first-letter capitalization
          if (token.charAt(0) === token.charAt(0).toUpperCase()) {
            return alien.charAt(0).toUpperCase() + alien.slice(1);
          }
          return alien;
        }

        return token;
      });

      return translated.join('');
    }

    function translateAlienToEn(text) {
      if (!text.trim()) return '';
      let working = text;

      // Handle multi-word alien phrases in memory
      const sortedAlienKeys = Array.from(alienToEngMap.keys())
        .filter(k => k.includes(' '))
        .sort((a, b) => b.length - a.length);

      let placeholders = [];
      sortedAlienKeys.forEach((phrase, idx) => {
        const regex = new RegExp(`\\b${escapeRegExp(phrase)}\\b`, 'gi');
        if (regex.test(working)) {
          const key = `___APHRASE_${idx}___`;
          placeholders.push({ key, val: alienToEngMap.get(phrase) });
          working = working.replace(regex, key);
        }
      });

      // Split into tokens
      const tokens = working.split(/([a-zA-Z0-9_\-]+|\s+|[^\s\w]+)/g);
      const translated = tokens.map(token => {
        if (!token) return '';
        const ph = placeholders.find(p => p.key === token);
        if (ph) return ph.val;

        if (/^[a-zA-Z0-9]+$/.test(token)) {
          const eng = decodeWordToEnglish(token);
          if (token.charAt(0) === token.charAt(0).toUpperCase()) {
            return eng.charAt(0).toUpperCase() + eng.slice(1);
          }
          return eng;
        }

        return token;
      });

      return translated.join('');
    }

    function escapeRegExp(string) {
      return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    /* ==========================================================
       5. SWAP, COPY & CLEAR CONTROLS
       ========================================================== */
    function swapLanguages() {
      currentMode = (currentMode === 'en-to-alien') ? 'alien-to-en' : 'en-to-alien';
      const left = document.getElementById('langLeft');
      const right = document.getElementById('langRight');
      const input = document.getElementById('sourceInput');
      const outText = document.getElementById('targetOutput').innerText;

      if (currentMode === 'en-to-alien') {
        left.textContent = "English";
        left.className = "font-display font-semibold text-sm text-emerald-400 tracking-wide";
        right.textContent = "Zitmol (Alien)";
        right.className = "font-display font-semibold text-sm text-cyan-400 tracking-wide";
        input.placeholder = "Type anything in English (e.g. 'are u lesbian', 'mental', 'wtf')...";
      } else {
        left.textContent = "Zitmol (Alien)";
        left.className = "font-display font-semibold text-sm text-cyan-400 tracking-wide";
        right.textContent = "English";
        right.className = "font-display font-semibold text-sm text-emerald-400 tracking-wide";
        input.placeholder = "Type in Zitmol (e.g. 'til lit lizmi', 'mimtol', 'zotzom')...";
      }

      if (outText && !outText.startsWith('Translation will')) {
        input.value = outText.trim();
      }
      handleInput();
    }

    function clearText() {
      document.getElementById('sourceInput').value = '';
      handleInput();
    }

    function copyTranslation() {
      const text = document.getElementById('targetOutput').innerText;
      if (!text || text.startsWith('Translation will')) return;

      const temp = document.createElement('textarea');
      temp.value = text;
      document.body.appendChild(temp);
      temp.select();
      try {
        document.execCommand('copy');
        const btn = document.getElementById('copyBtnText');
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy'; }, 1500);
      } catch (e) {}
      document.body.removeChild(temp);
    }

    /* ==========================================================
       6. WEB AUDIO API SYNTH VOICE
       ========================================================== */
    let audioCtx = null;
    function speakAlienVoice() {
      let text = (currentMode === 'en-to-alien')
        ? document.getElementById('targetOutput').innerText
        : document.getElementById('sourceInput').value;

      text = text.replace(/[^ziotml]/gi, '').toLowerCase();
      if (!text) return;

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const wave = document.getElementById('audioWave');
      const speaker = document.getElementById('speakerIcon');
      const voiceText = document.getElementById('voiceBtnText');

      wave.classList.remove('hidden');
      speaker.classList.add('hidden');
      voiceText.textContent = 'Beaming...';

      const tones = {
        'z': { freq: 360, type: 'sawtooth' },
        'i': { freq: 940, type: 'sine' },
        'o': { freq: 240, type: 'triangle' },
        't': { freq: 720, type: 'square' },
        'm': { freq: 180, type: 'sine' },
        'l': { freq: 540, type: 'sine' }
      };

      const maxLetters = Math.min(text.length, 28);
      const step = 0.08;

      for (let i = 0; i < maxLetters; i++) {
        const char = text[i];
        const cfg = tones[char] || { freq: 440, type: 'sine' };

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        const startTime = audioCtx.currentTime + (i * step);
        const dur = 0.07;

        osc.type = cfg.type;
        osc.frequency.setValueAtTime(cfg.freq, startTime);
        osc.frequency.exponentialRampToValueAtTime(cfg.freq * 1.3, startTime + dur);

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(0.18, startTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + dur + 0.01);
      }

      setTimeout(() => {
        wave.classList.add('hidden');
        speaker.classList.remove('hidden');
        voiceText.textContent = 'Speak Alien';
      }, (maxLetters * step * 1000) + 150);
    }

    /* ==========================================================
       7. QUICK PHRASE PILLS & DICTIONARY MODAL
       ========================================================== */
    const TEST_PRESETS = [
      { label: "mental", text: "mental" },
      { label: "are you lesbian", text: "are you lesbian" },
      { label: "wtf bro", text: "wtf bro" },
      { label: "chill dude", text: "chill dude" },
      { label: "good morning", text: "good morning" },
      { label: "who are you", text: "who are you" },
      { label: "i see you", text: "i see you" },
      { label: "danger! run!", text: "danger! run!" }
    ];

    function initQuickPills() {
      const container = document.getElementById('quickPills');
      container.innerHTML = '';
      TEST_PRESETS.forEach(item => {
        const chip = document.createElement('button');
        chip.className = "px-3 py-1 rounded-full text-xs font-mono bg-slate-900 hover:bg-emerald-500/10 border border-white/5 hover:border-emerald-500/30 text-slate-300 hover:text-emerald-300 transition active:scale-95";
        chip.textContent = item.label;
        chip.onclick = () => {
          if (currentMode !== 'en-to-alien') swapLanguages();
          document.getElementById('sourceInput').value = item.text;
          handleInput();
          speakAlienVoice();
        };
        container.appendChild(chip);
      });
    }

    function toggleDictionary() {
      const modal = document.getElementById('dictModal');
      const isHidden = modal.classList.contains('hidden');
      if (isHidden) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        renderDictionary();
      } else {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    function renderDictionary() {
      const query = (document.getElementById('dictSearch').value || '').toLowerCase();
      const list = document.getElementById('dictList');
      list.innerHTML = '';

      const entries = Array.from(engToAlienMap.entries()).filter(([eng, alien]) => {
        return eng.includes(query) || alien.includes(query);
      });

      if (entries.length === 0) {
        list.innerHTML = `<div class="text-xs text-slate-500 font-mono py-4 text-center">No words match query</div>`;
        return;
      }

      entries.forEach(([eng, alien]) => {
        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-2 rounded-lg hover:bg-white/5 transition text-xs font-mono cursor-pointer";
        row.innerHTML = `
          <span class="text-white">${eng}</span>
          <span class="text-emerald-400 font-bold tracking-wider">${alien}</span>
        `;
        row.onclick = () => {
          if (currentMode !== 'en-to-alien') swapLanguages();
          document.getElementById('sourceInput').value = eng;
          toggleDictionary();
          handleInput();
          speakAlienVoice();
        };
        list.appendChild(row);
      });
    }

    window.onload = function() {
      // Ensure clean initial state
      const sourceInput = document.getElementById('sourceInput');
      if (!sourceInput.value.trim()) {
        sourceInput.value = 'hi';
      }
      handleInput();
    };
  </script>
